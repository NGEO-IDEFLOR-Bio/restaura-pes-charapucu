# ==============================================================================
# Diretrizes e Parâmetros Técnicos — Banco de Restauração PES Charapucu
# IDEFLOR-Bio / Núcleo de Geotecnologias (NGEO)
# ==============================================================================

projeto:
  nome: "Banco de Áreas Elegíveis para Restauração Florestal — PES Charapucu"
  orgao: "IDEFLOR-Bio / NGEO"
  unidade_conservacao: "Parque Estadual Charapucu"
  municipio: "Afuá"
  regiao_integracao: "Marajó"
  meta_area_ha: 130.0

cartografia:
  crs_metric: "EPSG:31988"       # SIRGAS 2000 / UTM zone 22N (cálculos de área, distâncias e buffers)
  crs_geographic: "EPSG:4674"   # SIRGAS 2000 Geográfico
  crs_web: "EPSG:4326"          # WGS 84 (Leaflet / Folium / Mapas Web)

caminhos:
  dados_raw: "data/raw"
  dados_reference: "data/reference"
  dados_processed: "data/processed"
  outputs_vetores: "outputs/vetores"
  outputs_relatorios: "outputs/relatorios"
  limite_uc_raw: "data/raw/ucs_estaduais.geojson"
  limite_charapucu_geojson: "data/raw/limite_pes_charapucu.geojson"
  limite_charapucu_gpkg: "data/processed/limite_pes_charapucu_utm22n.gpkg"

metodologia_restauracao:
  limiares_delta_ndvi:
    rna:
      min: 0.15
      descricao: "Regeneração Natural Assistida (RNA) / Condução de regenerantes"
    enriquecimento:
      min: -0.05
      max: 0.15
      descricao: "Enriquecimento Florestal / Adensamento de espécies de várzea"
    plantio_direto:
      max: -0.05
      descricao: "Plantio Direto / Restauração Ativa Plena"

estratificacao:
  classes_area_ha:
    pequeno:
      max: 5.0
      label: "Pequeno (< 5 ha)"
    medio:
      min: 5.0
      max: 20.0
      label: "Médio (5 - 20 ha)"
    grande:
      min: 20.0
      max: 50.0
      label: "Grande (20 - 50 ha)"
    macro:
      min: 50.0
      label: "Macro-gleba (> 50 ha)"

  acesso_fluvial_metros:
    alta:
      max: 200.0
      label: "Alta (< 200 m)"
    media:
      min: 200.0
      max: 800.0
      label: "Média (200 - 800 m)"
    baixa:
      min: 800.0
      label: "Baixa (> 800 m)"
